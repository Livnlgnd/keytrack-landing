<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting - KeyAudit Pro</title>
    <script>
      (function () {
        var path = window.location.pathname;
        window.location.replace(path.indexOf('/app/') === 0 ? '/app/' : '/');
      })();
    </script>
  </head>
  <body></body>
</html>
