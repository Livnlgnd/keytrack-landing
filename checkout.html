<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout | KeyAudit Pro</title>
    <meta name="robots" content="noindex,nofollow" />
    <script src="https://js.stripe.com/dahlia/stripe.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #1f2937;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
        display: grid;
        place-items: center;
      }
      main {
        width: 100%;
        max-width: 720px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 20px 50px rgb(15 23 42 / 10%);
        padding: 28px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
      }
      p {
        margin: 0 0 22px;
        color: #64748b;
        line-height: 1.5;
      }
      .plan-label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .plan-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-bottom: 22px;
      }
      select,
      button {
        min-height: 44px;
        border-radius: 8px;
        font: inherit;
      }
      select {
        width: 100%;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        padding: 0 12px;
        color: #1f2937;
      }
      button {
        border: 0;
        background: #0570de;
        color: #ffffff;
        padding: 0 18px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      #checkout-form {
        min-height: 120px;
      }
      #status {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #f1f5f9;
        color: #475569;
        font-size: 14px;
        line-height: 1.4;
      }
      #status[data-state="error"] {
        background: #fef2f2;
        color: #b91c1c;
      }
      #status[data-state="success"],
      #status[data-state="ready"] {
        background: #f0fdf4;
        color: #15803d;
      }
      @media (max-width: 520px) {
        .plan-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Complete your purchase</h1>
      <p>Secure payment powered by Stripe.</p>

      <label class="plan-label" for="plan">Choose a plan</label>
      <div class="plan-row">
        <select id="plan" disabled>
          <option>Loading plans...</option>
        </select>
        <button id="start" type="button" disabled>Continue to payment</button>
      </div>

      <div id="checkout-form"></div>
      <div id="status" data-state="loading">Preparing secure checkout...</div>
    </main>

    <script>
      const STRIPE_PUBLISHABLE_KEY =
        'pk_live_51UXQwhPlnAdoCAVXG0IQQwGGlUNnfdVokvkPB3RDBBbgG5qgQUINZfFGtq21wN2ITwR7eJfqxnZE9vNYQNglyr4n00MwHueF9D';
      const CHECKOUT_API_URL =
        'https://keytrack-license.joshua-c77.workers.dev/api/stripe/checkout-session';
      const PLANS_API_URL =
        'https://keytrack-license.joshua-c77.workers.dev/api/stripe/plans';

      const appearance = {
        theme: 'stripe',
        labels: 'auto',
        inputs: 'spaced',
        variables: {
          borderRadius: '4px',
          colorBackground: '#ffffff',
          colorDanger: '#df1b41',
          colorPrimary: '#0570de',
          colorSuccess: '#00c853',
          colorText: '#30313d',
          fontFamily: 'default',
          fontSizeBase: '16px',
          spacingUnit: '4px',
        },
      };

      const statusBox = document.getElementById('status');
      const planSelect = document.getElementById('plan');
      const startButton = document.getElementById('start');

      function setStatus(message, state) {
        statusBox.textContent = message;
        statusBox.dataset.state = state;
      }

      function renderPlans(plans, defaultPriceId) {
        const groups = [
          ['license', 'Licenses'],
          ['cloud-backup', 'Cloud Backup'],
          ['lan-sync', 'LAN Sync'],
        ];
        const preselected =
          new URLSearchParams(window.location.search).get('price_id') ||
          defaultPriceId;

        planSelect.replaceChildren();
        for (const [kind, label] of groups) {
          const items = plans
            .filter((plan) => plan.kind === kind)
            .sort((a, b) => a.name.localeCompare(b.name));
          if (!items.length) continue;

          const group = document.createElement('optgroup');
          group.label = label;
          for (const plan of items) {
            const option = document.createElement('option');
            option.value = plan.priceId;
            option.textContent = plan.name;
            if (plan.priceId === preselected) option.selected = true;
            group.append(option);
          }
          planSelect.append(group);
        }

        if (!planSelect.options.length) {
          throw new Error('No checkout plans are available.');
        }

        planSelect.disabled = false;
        startButton.disabled = false;
        setStatus('Choose a plan, then continue to payment.', 'ready');
      }

      async function loadPlans() {
        try {
          const response = await fetch(PLANS_API_URL);
          const json = await response.json();
          if (!response.ok || !Array.isArray(json.plans)) {
            throw new Error(json.error || 'Unable to load plans.');
          }
          renderPlans(json.plans, json.defaultPriceId);
        } catch (error) {
          console.error('Plans error:', error);
          setStatus(
            error instanceof Error ? error.message : 'Unable to load plans.',
            'error',
          );
        }
      }

      async function mountCheckout(priceId) {
        startButton.disabled = true;
        planSelect.disabled = true;
        setStatus('Preparing secure checkout...', 'loading');

        try {
          const response = await fetch(CHECKOUT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ price_id: priceId }),
          });
          const json = await response.json();

          if (!response.ok || !json.client_secret) {
            throw new Error(json.error || 'Unable to start checkout.');
          }

          const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
          const checkout = stripe.initCheckoutFormSdk({
            clientSecret: json.client_secret,
            appearance,
          });
          const form = checkout.createForm({ layout: 'expanded' });
          form.mount('#checkout-form');

          const loadActionsResult = await checkout.loadActions();
          if (loadActionsResult.type !== 'success') {
            throw new Error('Unable to load checkout actions.');
          }

          form.on('confirm', async (event) => {
            try {
              await loadActionsResult.actions.confirm({
                formConfirmEvent: event,
              });
            } catch (error) {
              console.error('Payment confirmation error:', error);
              setStatus(
                error instanceof Error
                  ? error.message
                  : 'Payment confirmation failed.',
                'error',
              );
            }
          });

          setStatus('Checkout is ready.', 'ready');
        } catch (error) {
          console.error('Checkout error:', error);
          setStatus(
            error instanceof Error ? error.message : 'Unable to load checkout.',
            'error',
          );
          planSelect.disabled = false;
          startButton.disabled = false;
        }
      }

      startButton.addEventListener('click', () => {
        if (planSelect.value) mountCheckout(planSelect.value);
      });

      loadPlans();
    </script>
  </body>
</html>
